[project]
name = "metropolis-backend"
version = "0.1.0"
description = "Flask backend for Metropolis Nexus"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0,<4",
    "flask-cors>=4.0,<6",
    "psycopg2-binary>=2.9,<3",
    "boto3>=1.35,<2",
    "python-dotenv>=1.0,<2",
    "apifairy>=1.4,<2",
    "flask-marshmallow>=1.2,<2",
    "flask-sqlalchemy>=3.1,<4",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "flask-limiter>=3.8,<4",
    "marshmallow>=3.20,<4",
    "webargs>=8.0,<9",
    "pyjwt>=2.8,<3",
    "werkzeug>=3.0,<4",
    "gunicorn>=22.0,<23",
    "flask-socketio>=5.4,<6",
    "eventlet>=0.36,<1",
    "stripe>=11.0,<13",
    "redis>=5.0,<6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "requests>=2.32,<3",
    "ruff>=0.6,<0.8",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# eventlet.monkey_patch() must run before Flask/SocketIO imports
"run.py" = ["E402"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
