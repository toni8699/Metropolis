[project]
name = "metropolis-backend"
version = "0.1.0"
description = "FastAPI backend for Metropolis Nexus"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "pydantic-settings>=2.0,<3",
    "slowapi>=0.1.9,<0.2",
    "email-validator>=2.0,<3",
    "psycopg2-binary>=2.9,<3",
    "boto3>=1.35,<2",
    "python-dotenv>=1.0,<2",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "pyjwt>=2.8,<3",
    "werkzeug>=3.0,<4",
    "gunicorn>=22.0,<23",
    "stripe>=11.0,<13",
    "redis>=5.0,<6",
    "python-socketio>=5.11,<6",
    "arq>=0.26,<0.27",
    "resend>=2.32.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "requests>=2.32,<3",
    "httpx2>=2.0,<3",
    "ruff>=0.15,<0.16",
    "faker>=30.0,<38",
    "factory-boy>=3.3,<4",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"vroom/dependencies/**/*.py" = ["B008"]
"vroom/routers/**/*.py" = ["B008"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv]
package = false
