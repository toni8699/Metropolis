# Docker dev stack: frontend + backend against Neon + S3 from project .env
# Requires .env with DATABASE_URL (Neon), AWS_*, S3_BUCKET_NAME
# Run: docker compose up --build

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: drivebnb-backend:local
    container_name: drivebnb_backend
    env_file:
      - .env
    environment:
      PORT: "5000"
      FLASK_DEBUG: "1"
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app/backend
      - ./db:/app/db
    working_dir: /app/backend
    command: >
      bash -c "
        echo 'Applying Alembic migrations (Neon)...' &&
        alembic upgrade head &&
        echo 'Starting backend server...' &&
        python run.py
      "

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: drivebnb-frontend:local
    container_name: drivebnb_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      VITE_API_URL: http://localhost:5000
    depends_on:
      - backend
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3000"
    stdin_open: true
    tty: true

volumes:
  frontend_node_modules:
