# Docker dev stack: frontend + backend against Neon + S3 from project .env
# Requires .env with DATABASE_URL (Neon), AWS_*, S3_BUCKET_NAME
#
# Dev:  docker compose up --build
# Test: docker compose --profile test up --build
#       (starts backend, waits for /api/health, runs pytest, test container exits)

services:
  redis:
    image: redis:7-alpine
    container_name: drivebnb_redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: drivebnb-backend:local
    container_name: drivebnb_backend
    env_file:
      - .env
    environment:
      PORT: "5000"
      FLASK_DEBUG: "1"
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173
      REDIS_URL: redis://redis:6379/0
      RATELIMIT_ENABLED: "0"
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
    depends_on:
      - redis
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app/backend
      - ./db:/app/db
    working_dir: /app/backend
    command: >
      bash -c "
        echo 'Applying Alembic migrations (Neon)...' &&
        alembic upgrade head &&
        echo 'Starting ASGI (FastAPI + Socket.IO)...' &&
        uvicorn metropolis.asgi:app --host 0.0.0.0 --port 5000 --reload
      "
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 40s

  worker:
    image: drivebnb-backend:local
    container_name: drivebnb_worker
    env_file:
      - .env
    environment:
      FLASK_DEBUG: "1"
      REDIS_URL: redis://redis:6379/0
      BOOKING_SWEEP_ENABLED: "1"
    depends_on:
      - redis
      - backend
    volumes:
      - ./backend:/app/backend
      - ./db:/app/db
    working_dir: /app/backend
    command: arq metropolis.jobs.booking_sweep.WorkerSettings

  test:
    profiles: ["test"]
    image: drivebnb-backend:local
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: drivebnb_test
    env_file:
      - .env
    environment:
      INTEGRATION_API_URL: http://backend:5000
      RATELIMIT_ENABLED: "0"
    volumes:
      - .:/app
    working_dir: /app/backend
    depends_on:
      backend:
        condition: service_healthy
    command: >
      bash -c "
        pip install -q pytest requests python-dotenv httpx2 &&
        python -m pytest tests -v --tb=short
      "

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: drivebnb-frontend:local
    container_name: drivebnb_frontend
    env_file:
      - frontend/.env.local
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      VITE_API_URL: http://localhost:5000
    depends_on:
      - backend
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3000"
    stdin_open: true
    tty: true

volumes:
  frontend_node_modules:
