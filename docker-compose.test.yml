# Isolated Postgres for backend pytest — does not touch Neon from .env
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.test.yml --profile test run --rm test

services:
  postgres_test:
    profiles: ["test"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: metropolis
      POSTGRES_PASSWORD: metropolis
      POSTGRES_DB: metropolis_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metropolis -d metropolis_test"]
      interval: 3s
      timeout: 5s
      retries: 10

  worker:
    environment:
      BOOKING_SWEEP_ENABLED: "0"
      RESEND_API_KEY: ""
      MAIL_FROM: ""

  backend:
    environment:
      DATABASE_URL: postgresql://metropolis:metropolis@postgres_test:5432/metropolis_test
      STRIPE_SECRET_KEY: ""
      STRIPE_WEBHOOK_SECRET: ""
      RESEND_API_KEY: ""
      MAIL_FROM: ""
    depends_on:
      postgres_test:
        condition: service_healthy

  test:
    environment:
      DATABASE_URL: postgresql://metropolis:metropolis@postgres_test:5432/metropolis_test
      INTEGRATION_API_URL: http://127.0.0.1:5000
      JWT_SECRET: ci-test-jwt-secret
      ALLOW_USER_LISTINGS: "1"
      RATELIMIT_ENABLED: "0"
      BOOKING_SWEEP_ENABLED: "0"
      STRIPE_SECRET_KEY: ""
      STRIPE_WEBHOOK_SECRET: ""
      RESEND_API_KEY: ""
      MAIL_FROM: ""
    volumes:
      - /app/backend/.venv
    depends_on:
      postgres_test:
        condition: service_healthy
    command: >
      bash -c "
        pip install -q uv &&
        uv sync --frozen --extra dev &&
        uv run alembic upgrade head &&
        uv run python scripts/seed_ci_database.py &&
        PORT=5000 DEBUG=0 uv run uvicorn metropolis.asgi:app --host 0.0.0.0 --port 5000 &
        echo \$$! > /tmp/metropolis-api.pid &&
        for i in $$(seq 1 30); do
          if curl -sf http://127.0.0.1:5000/api/health >/dev/null; then
            echo 'API ready';
            break;
          fi;
          sleep 2;
        done &&
        uv run pytest tests -v --tb=short;
        status=\$$?;
        if [ -f /tmp/metropolis-api.pid ]; then kill $$(cat /tmp/metropolis-api.pid) 2>/dev/null || true; fi;
        exit \$$status
      "
