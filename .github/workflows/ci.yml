name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"
  DATABASE_URL: postgresql://metropolis:metropolis@localhost:5432/metropolis_test
  JWT_SECRET: ci-test-jwt-secret
  ALLOW_USER_LISTINGS: "1"
  INTEGRATION_API_URL: http://127.0.0.1:5000
  RATELIMIT_ENABLED: "0"
  BOOKING_SWEEP_ENABLED: "0"
  STRIPE_SECRET_KEY: ""
  STRIPE_WEBHOOK_SECRET: ""

jobs:
  backend-lint:
    name: Backend lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen --extra dev

      - name: Ruff check
        working-directory: backend
        run: uv run ruff check .

      - name: Ruff format check
        working-directory: backend
        run: uv run ruff format --check .

  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: metropolis
          POSTGRES_PASSWORD: metropolis
          POSTGRES_DB: metropolis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U metropolis -d metropolis_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen --extra dev

      - name: Apply database schema
        working-directory: backend
        run: uv run alembic upgrade head

      - name: Seed CI test data
        working-directory: backend
        run: uv run python scripts/seed_ci_database.py

      - name: Start API server
        working-directory: backend
        run: |
          PORT=5000 DEBUG=0 uv run uvicorn metropolis.asgi:app --host 0.0.0.0 --port 5000 &
          echo $! > /tmp/metropolis-api.pid
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:5000/api/health >/dev/null; then
              echo "API ready"
              exit 0
            fi
            sleep 2
          done
          echo "API failed to start"
          exit 1

      - name: Pytest
        working-directory: backend
        run: uv run pytest tests -v --tb=short

      - name: Stop API server
        if: always()
        run: |
          if [ -f /tmp/metropolis-api.pid ]; then
            kill "$(cat /tmp/metropolis-api.pid)" 2>/dev/null || true
          fi

  frontend-lint:
    name: Frontend lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: ESLint
        working-directory: frontend
        run: npm run lint

  frontend-test:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Vitest
        working-directory: frontend
        run: npm run test

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    needs: [frontend-lint, frontend-test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Production build
        working-directory: frontend
        env:
          VITE_API_URL: http://localhost:5000
          VITE_GOOGLE_MAPS_API_KEY: ""
        run: npm run build

  deploy:
    name: Deploy backend
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-test, frontend-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        env:
          IMAGE_SHA: ghcr.io/${{ github.repository_owner }}/metropolis-backend:${{ github.sha }}
          IMAGE_LATEST: ghcr.io/${{ github.repository_owner }}/metropolis-backend:latest
        run: |
          docker build -f backend/Dockerfile.prod -t "$IMAGE_SHA" -t "$IMAGE_LATEST" .
          docker push "$IMAGE_SHA"
          docker push "$IMAGE_LATEST"

      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK" ]; then
            curl -fsS -X POST "$RENDER_DEPLOY_HOOK"
          else
            echo "RENDER_DEPLOY_HOOK not set; image pushed to GHCR only"
          fi

  e2e:
    name: E2E smoke (main)
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      CORS_ORIGINS: http://127.0.0.1:3000,http://localhost:3000
      STRIPE_SECRET_KEY: ""
      STRIPE_WEBHOOK_SECRET: ""
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: metropolis
          POSTGRES_PASSWORD: metropolis
          POSTGRES_DB: metropolis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U metropolis -d metropolis_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          cd backend && uv sync --frozen
          cd ../frontend && npm ci && npx playwright install --with-deps chromium

      - name: Apply schema and seed
        working-directory: backend
        run: |
          uv run alembic upgrade head
          uv run python scripts/seed_ci_database.py

      - name: Start API
        working-directory: backend
        env:
          CORS_ORIGINS: http://127.0.0.1:3000,http://localhost:3000
        run: |
          PORT=5000 DEBUG=1 uv run uvicorn metropolis.asgi:app --host 0.0.0.0 --port 5000 &
          echo $! > /tmp/metropolis-api.pid
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:5000/api/health >/dev/null; then
              echo "API ready"
              exit 0
            fi
            sleep 2
          done
          echo "API failed to start"
          exit 1

      - name: Build and serve frontend
        working-directory: frontend
        env:
          VITE_API_URL: http://127.0.0.1:5000
        run: |
          npm run build
          npx vite preview --host 127.0.0.1 --port 3000 &
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:3000 && exit 0
            sleep 2
          done
          exit 1

      - name: Playwright smoke
        working-directory: frontend
        env:
          E2E_BASE_URL: http://127.0.0.1:3000
          E2E_API_URL: http://127.0.0.1:5000
        run: npm run test:e2e
