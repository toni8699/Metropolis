name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"
  DATABASE_URL: postgresql://metropolis:metropolis@localhost:5432/metropolis_test
  JWT_SECRET: ci-test-jwt-secret
  ALLOW_USER_LISTINGS: "1"
  INTEGRATION_API_URL: http://127.0.0.1:5000

jobs:
  backend-lint:
    name: Backend lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Ruff
        run: pip install "ruff>=0.6,<0.8"

      - name: Ruff check
        working-directory: backend
        run: ruff check metropolis tests scripts

      - name: Ruff format check
        working-directory: backend
        run: ruff format --check metropolis tests scripts

  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: metropolis
          POSTGRES_PASSWORD: metropolis
          POSTGRES_DB: metropolis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U metropolis -d metropolis_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt "pytest>=8.3,<9" "requests>=2.32,<3"

      - name: Apply database schema
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/schema.sql

      - name: Run Alembic migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Seed CI test data
        run: python backend/scripts/seed_ci_database.py

      - name: Start API server
        working-directory: backend
        run: |
          PORT=5000 FLASK_DEBUG=0 python run.py &
          echo $! > /tmp/metropolis-api.pid
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:5000/api/health >/dev/null; then
              echo "API ready"
              exit 0
            fi
            sleep 2
          done
          echo "API failed to start"
          exit 1

      - name: Pytest
        working-directory: backend
        run: pytest tests -v --tb=short

      - name: Stop API server
        if: always()
        run: |
          if [ -f /tmp/metropolis-api.pid ]; then
            kill "$(cat /tmp/metropolis-api.pid)" 2>/dev/null || true
          fi

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Production build
        working-directory: frontend
        env:
          VITE_API_URL: http://localhost:5000
          VITE_GOOGLE_MAPS_API_KEY: ""
        run: npm run build
